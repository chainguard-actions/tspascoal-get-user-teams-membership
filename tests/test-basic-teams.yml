name: Test basic teams output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: get_teams
        uses: .
        continue-on-error: true
        with:
          username: tspascoal
          GITHUB_TOKEN: ${{ github.token }}
      - name: Assert action ran and either succeeded or failed gracefully
        env:
          OUTCOME: ${{ steps.get_teams.outcome }}
          TEAMS: ${{ steps.get_teams.outputs.teams }}
          IS_MEMBER: ${{ steps.get_teams.outputs.isTeamMember }}
        run: |
          echo "outcome: $OUTCOME"
          echo "teams: $TEAMS"
          echo "isTeamMember: $IS_MEMBER"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded, validating outputs..."
            # isTeamMember should be 'false' when no team input is given
            if [ "$IS_MEMBER" != "false" ]; then
              echo "FAIL: isTeamMember should be 'false' when no team input is given, got: $IS_MEMBER"
              exit 1
            fi
            echo "PASS: isTeamMember is 'false' as expected when no team specified"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "Action failed (likely due to insufficient token permissions - read:org scope required)"
            echo "PASS: action failed gracefully (expected when GITHUB_TOKEN lacks read:org scope)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
