name: Test basic teams listing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          username: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Assert action ran and produced expected outputs or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TEAMS: ${{ steps.action.outputs.teams }}
          IS_MEMBER: ${{ steps.action.outputs.isTeamMember }}
        run: |
          echo "action outcome: $OUTCOME"
          echo "teams output: $TEAMS"
          echo "isTeamMember output: $IS_MEMBER"
          if [ "$OUTCOME" = "success" ]; then
            # Action succeeded: isTeamMember should be false when no team input given
            if [ "$IS_MEMBER" != "false" ]; then
              echo "FAIL: expected isTeamMember to be 'false' when no team input given, got: $IS_MEMBER"
              exit 1
            fi
            echo "PASS: action succeeded, isTeamMember is 'false' as expected"
          elif [ "$OUTCOME" = "failure" ]; then
            # Action failed - this is expected when GITHUB_TOKEN lacks read:org scope
            # The action calls setFailed() on error, which is the correct behavior
            echo "PASS: action failed gracefully (likely due to token scope limitations - read:org required)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
