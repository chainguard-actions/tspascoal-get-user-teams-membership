name: Test basic usage - get user teams
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: get-teams
        uses: .
        continue-on-error: true
        with:
          username: octocat
          organization: github
          GITHUB_TOKEN: ${{ github.token }}
      - name: Assert outputs are present
        env:
          TEAMS: ${{ steps.get-teams.outputs.teams }}
          IS_MEMBER: ${{ steps.get-teams.outputs.isTeamMember }}
          OUTCOME: ${{ steps.get-teams.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "teams: $TEAMS"
          echo "isTeamMember: $IS_MEMBER"
          # The action either succeeds or fails due to API permissions,
          # but it must have run (outcome is not empty)
          if [ -z "$OUTCOME" ]; then
            echo "FAIL: action did not run (outcome is empty)"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME"
