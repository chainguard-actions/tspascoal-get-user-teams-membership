name: Test default organization and CSV teams
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          organization: actions
          username: Codertocat
          team: team-a,team-b,team-c
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Assert action ran and isTeamMember output is valid when successful
        env:
          OUTCOME: ${{ steps.action.outcome }}
          IS_MEMBER: ${{ steps.action.outputs.isTeamMember }}
          TEAMS: ${{ steps.action.outputs.teams }}
        run: |
          echo "action outcome: $OUTCOME"
          echo "isTeamMember output: '$IS_MEMBER'"
          echo "teams output: '$TEAMS'"
          if [ "$OUTCOME" = "success" ]; then
            # When a team (or CSV of teams) is specified and action succeeds,
            # isTeamMember must be 'true' or 'false'
            if [ "$IS_MEMBER" != "true" ] && [ "$IS_MEMBER" != "false" ]; then
              echo "FAIL: expected isTeamMember to be 'true' or 'false', got '$IS_MEMBER'"
              exit 1
            fi
            echo "PASS: isTeamMember is '$IS_MEMBER'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and failed gracefully (expected without org:read scope)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
