name: Test multiple teams CSV check
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          username: octocat
          organization: github
          team: nonexistent-team-alpha,nonexistent-team-beta,nonexistent-team-gamma
          GITHUB_TOKEN: fake-token-for-act-testing

      - name: Assert action ran and produced output or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          IS_MEMBER: ${{ steps.action.outputs.isTeamMember }}
          TEAMS: ${{ steps.action.outputs.teams }}
        run: |
          echo "action outcome: $OUTCOME"
          echo "isTeamMember: $IS_MEMBER"
          echo "teams: $TEAMS"
          # Under act with a fake token, the action will fail due to API error
          # That is expected behavior - the action correctly calls setFailed on error
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded - verifying isTeamMember is false for nonexistent teams"
            if [ "$IS_MEMBER" != "false" ]; then
              echo "FAIL: expected isTeamMember to be 'false' for nonexistent teams CSV, got '$IS_MEMBER'"
              exit 1
            fi
            echo "PASS: isTeamMember is correctly 'false' for CSV of nonexistent teams"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected with fake token (API call rejected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
