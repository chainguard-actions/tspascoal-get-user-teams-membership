name: Test team membership check with CSV teams input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          username: ${{ github.repository_owner }}
          team: nonexistent-team-aaa,nonexistent-team-bbb,nonexistent-team-ccc
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Assert isTeamMember is false or action failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          IS_MEMBER: ${{ steps.action.outputs.isTeamMember }}
          TEAMS: ${{ steps.action.outputs.teams }}
        run: |
          echo "action outcome: $OUTCOME"
          echo "isTeamMember: $IS_MEMBER"
          echo "teams: $TEAMS"
          if [ "$OUTCOME" = "success" ]; then
            # Action succeeded: user should not be in any of the nonexistent teams
            if [ "$IS_MEMBER" != "false" ]; then
              echo "FAIL: expected isTeamMember to be 'false' when user is not in any of the specified teams, got: $IS_MEMBER"
              exit 1
            fi
            echo "PASS: isTeamMember is correctly 'false' when user is not in any of the CSV teams"
          elif [ "$OUTCOME" = "failure" ]; then
            # Action failed - expected when GITHUB_TOKEN lacks read:org scope
            echo "PASS: action failed gracefully (likely due to token scope limitations - read:org required)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
