name: Test team membership check - non-member
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          organization: ${{ github.repository_owner }}
          username: ${{ github.actor }}
          team: nonexistent-team-xyz-12345
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Assert isTeamMember is false or action failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          IS_MEMBER: ${{ steps.action.outputs.isTeamMember }}
          TEAMS: ${{ steps.action.outputs.teams }}
        run: |
          echo "action outcome: $OUTCOME"
          echo "isTeamMember output: '$IS_MEMBER'"
          echo "teams output: $TEAMS"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$IS_MEMBER" = "true" ]; then
              echo "FAIL: expected isTeamMember to be false for a nonexistent team"
              exit 1
            fi
            echo "PASS: isTeamMember is false for nonexistent team"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "INFO: action failed - likely due to API permissions (read:org scope required)"
            echo "PASS: action failed gracefully as expected in restricted token environment"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
