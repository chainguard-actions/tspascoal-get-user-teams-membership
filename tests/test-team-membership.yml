name: Test team membership check
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          username: tspascoal
          organization: tspascoal
          team: some-team
          GITHUB_TOKEN: ${{ github.token }}
        continue-on-error: true
      - name: Assert action ran with team input
        env:
          IS_MEMBER: ${{ steps.action.outputs.isTeamMember }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "isTeamMember: $IS_MEMBER"
          # The action may fail if the token lacks org read permissions,
          # but it must at least attempt to run (not a config/input error).
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with username, team, and GITHUB_TOKEN inputs"
